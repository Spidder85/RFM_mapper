        required: true
        schema:
          type: string
        example: attachment; filename*=utf-8''%D1%81%D0%BA%D0%B0%D0%BD.jpg
      requestBody:
        description: Файл
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      responses:
        '200':
          description: ''
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/documents/by_num_date/process:
    post:
      description: Обработать документ по его номеру и дате регистрации
      operationId: postZenith-objectApiV1DocumentsBy_num_dateProcess
      parameters:
      - name: revoke_on_error
        in: query
        description: Аннулировать документ при ошибке обработки
        required: false
        schema:
          type: boolean
        example: true
      requestBody:
        description: Номер и дата регистрации документа
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocNumDate'
            example:
              num: вх-МЗС-ЦО-23/11
              date: '2023-11-22'
        required: true
      responses:
        '200':
          description: ''
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/documents/by_num_date/process/with_result:
