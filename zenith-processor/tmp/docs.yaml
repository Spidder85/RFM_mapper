                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
components:
  schemas:
    Account:
      title: Account
      type: object
      required:
      - id
      - type
      properties:
        id:
          type: integer
          format: int32
        type:
          type: string
          const: account
    AccountRange:
      title: AccountRange
