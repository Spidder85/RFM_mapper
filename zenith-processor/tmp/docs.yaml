openapi: 3.1.0
info:
  title: ZenithObject API
  version: '1.0'
paths:
  /zenith-object/api/v1/raw:
    post:
      description: Вызов API системы Зенит напрямую, с использованием проприетарного
        формата сообщений
      operationId: postZenith-objectApiV1Raw
      requestBody:
        description: Запрос к системе Зенит
        content:
          application/xml:
            schema:
              type: string
            example: <__MESSAGE METHOD_NAME="PING" OBJ_NAME="ZENITH" OBJ_ID="0" SOURCE="TR"><PING/></__MESSAGE>
        required: true
      responses:
        '200':
          description: Ответ системы Зенит
          content:
            application/xml:
              schema:
                type: string
              example: <__MESSAGE><PONG/><__RESULT><CODE>0</CODE></__RESULT></__MESSAGE>
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/raw/files/upload:
    post:
      description: Загрузка файла на сервер
      operationId: postZenith-objectApiV1RawFilesUpload
      requestBody:
        description: Файл для загрузки
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      responses:
        '200':
          description: Имя файла в формате Зенита
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/raw/files/download:
    get:
      description: Загрузка файла с сервера
      operationId: getZenith-objectApiV1RawFilesDownload
      parameters:
      - name: filename
        in: query
        description: Имя файла в формате Зенита
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Данные файла
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/raw/files/delete:
    get:
      description: Удаление файла на сервере
      operationId: getZenith-objectApiV1RawFilesDelete
      parameters:
      - name: filename
        in: query
        description: Имя файла в формате Зенита
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/subdivision/id:
    get:
      description: Получить идентификатор текущего подразделения
      operationId: getZenith-objectApiV1SubdivisionId
      responses:
        '200':
          description: ИД подразделения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubdivisionId'
              example: 1
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/operdays/opened:
    get:
      description: Получить список открытых операционных дней
      operationId: getZenith-objectApiV1OperdaysOpened
      responses:
        '200':
          description: Список открытых операционных дней
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date
              example:
              - '2010-12-31'
              - '2023-11-09'
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/operdays/is_open:
    get:
      description: Проверить открыт ли операционный день
      operationId: getZenith-objectApiV1OperdaysIs_open
      parameters:
      - name: operday
        in: query
        description: Проверяемый операционный день
        required: true
        schema:
          type: string
          format: date
        example: '2023-11-08'
      - name: test_rights
        in: query
        description: Проверка имеет ли пользователь право на регистрацию и обработку
          документов этим операционным днем
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Открыт ли операционный день
          content:
            application/json:
              schema:
                type: boolean
              example: true
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/operdays/{operday}/state:
    get:
      description: Получить состояние операционного дня
      operationId: getZenith-objectApiV1OperdaysOperdayState
      parameters:
      - name: operday
        in: path
        description: Проверяемый день
        required: true
        schema:
          type: string
          format: date
        example: '2023-11-08'
      responses:
        '200':
          description: Состояние операционного дня
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperDayState'
              example:
                state: Opened
                documentsRegistrationAllowed: true
                documentsProcessingAllowed: false
                manualOutgoingDocumentsRegistrationAllowed: false
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/operdays/open_current:
    post:
      description: Открыть текущий операционный день
      operationId: postZenith-objectApiV1OperdaysOpen_current
      parameters:
      - name: only_working_days
        in: query
        description: Проверять является ли день рабочим
        required: true
        schema:
          type: boolean
        example: false
      responses:
        '200':
          description: ''
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/operdays/close:
    post:
      description: Закрыть операционный день
      operationId: postZenith-objectApiV1OperdaysClose
      parameters:
      - name: day_to_close
        in: query
        description: Какой день нужно закрыть
        required: true
        schema:
          type: string
        example: today
      - name: daily_reps
        in: query
        description: Формировать ли ежедневную отчетность
        required: true
        schema:
          type: boolean
        example: true
      - name: not_daily_reps
        in: query
        description: Формировать ли отчетность за прочие периоды (еженедельная, ежемесячная)
        required: true
        schema:
          type: boolean
        example: true
      - name: event_reps
        in: query
        description: Формировать ли отчетность по событиям
        required: true
        schema:
          type: boolean
        example: true
      responses:
        '200':
          description: ''
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/operdays/set_current:
    post:
      description: Выбрать текущий операционный день
      operationId: postZenith-objectApiV1OperdaysSet_current
      parameters:
      - name: operday
        in: query
        description: Операционный день
        required: true
        schema:
          type: string
          format: date
        example: '2026-06-23'
      responses:
        '200':
          description: ''
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/documents/register/zobjdoc:
    post:
      description: Зарегистрировать документ формата ZOBJ_DOC
      operationId: postZenith-objectApiV1DocumentsRegisterZobjdoc
      requestBody:
        description: Документ в формате XML
        content:
          application/xml:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Описание зарегистрированного документа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocInfo'
              example:
                id: '70897'
                uuid: 8c5d10ff-73c6-4e00-91b3-eb431656661c
                regnum: вх-МЗС-ЦО-23/11
                regdate: '2023-11-22'
                name: Запрос на выписку
                emitent: '193'
                state: 1
                result: 0
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/documents/register/mfo:
    post:
      description: Зарегистрировать документ формата MFO
      operationId: postZenith-objectApiV1DocumentsRegisterMfo
      parameters:
      - name: doc_type
        in: query
        description: Код типа документа по справочнику Зенита
        required: true
        schema:
          type: integer
        example: 15
      requestBody:
        description: Документ в формате XML
        content:
          application/xml:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Описание зарегистрированного документа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocInfo'
              example:
                id: '70897'
                uuid: 8c5d10ff-73c6-4e00-91b3-eb431656661c
                regnum: вх-МЗС-ЦО-23/11
                regdate: '2023-11-22'
                name: Запрос на выписку
                emitent: '193'
                state: 1
                result: 0
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/documents/{doc_id}/edoc_file:
    put:
      description: Прикрепить xml файл с ЭДО-документом к документу
      operationId: putZenith-objectApiV1DocumentsDoc_idEdoc_file
      parameters:
      - name: doc_id
        in: path
        description: ИД документа
        required: true
        schema:
          type: integer
          format: int64
        example: 70897
      - name: msg_type_id
        in: query
        description: Тип ЭДО-сообщения
        required: true
        schema:
          type: integer
          format: int32
        example: 142
      requestBody:
        description: ЭДО-документ в формате XML
        content:
          application/xml:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: ''
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/documents/{doc_id}/appendices/{appendix_num}/edoc_file:
    put:
      description: Прикрепить xml файл с ЭДО-документом к приложению документа
      operationId: putZenith-objectApiV1DocumentsDoc_idAppendicesAppendix_numEdoc_file
      parameters:
      - name: doc_id
        in: path
        description: ИД документа
        required: true
        schema:
          type: integer
          format: int64
        example: 70897
      - name: appendix_num
        in: path
        description: Номер приложения
        required: true
        schema:
          type: integer
        example: 2
      - name: msg_type_id
        in: query
        description: Тип ЭДО-сообщения
        required: true
        schema:
          type: integer
          format: int32
        example: 142
      requestBody:
        description: ЭДО-документ в формате XML
        content:
          application/xml:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: ''
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/documents/{doc_id}/attachment:
    put:
      description: Прикрепить файл к документу
      operationId: putZenith-objectApiV1DocumentsDoc_idAttachment
      parameters:
      - name: doc_id
        in: path
        description: ИД документа
        required: true
        schema:
          type: integer
          format: int64
        example: 70897
      - name: Content-Disposition
        in: header
        description: Описание вложения, допускается только тип `attachment`, имя файла
          сохраняется в Зените
        required: true
        schema:
          type: string
        example: attachment; filename*=utf-8''%D1%81%D0%BA%D0%B0%D0%BD.jpg
      requestBody:
        description: Файл
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      responses:
        '200':
          description: ''
        '400':
          description: ''
          headers:
            X-Zenith-Error-Code:
              description: Ошибка, возвращенная сервером Зенит-а
              required: false
              schema:
                type: integer
                format: int32
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
      security:
      - httpAuth: []
        apiKeyAuth: []
  /zenith-object/api/v1/documents/{doc_id}/attachment/appendices/{appendix_num}:
    put:
      description: Прикрепить файл к документу
      operationId: putZenith-objectApiV1DocumentsDoc_idAttachmentAppendicesAppendix_num
      parameters:
      - name: doc_id
        in: path
        description: ИД документа
        required: true
        schema:
          type: integer
          format: int64
        example: 70897
      - name: appendix_num
        in: path
        description: Номер приложения
        required: true
        schema:
          type: integer
        example: 2
      - name: Content-Disposition
        in: header
        description: Описание вложения, допускается только тип `attachment`, имя файла
